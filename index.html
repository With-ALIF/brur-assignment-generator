<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRUR Assignment Cover Page Generator</title>
    <link rel="stylesheet" href="lib/style.css">
</head>

<body>

<div class="form-container no-print" id="inputForm">
    <h2>BRUR Assignment Maker</h2>

    <div class="grid">
        <div class="input-group full-width">
            <label>Course Title:</label>
            <input type="text" id="courseTitle" placeholder="Digital Logic">
        </div>

        <div class="input-group">
            <label>Course Code:</label>
            <input type="text" id="courseCode" placeholder="CSE-2101">
        </div>

        <div class="input-group full-width">
            <label>Assignment Title:</label>
            <input type="text" id="assignmentTitle" placeholder="e.g. Impact of AI in Modern Education">
        </div>

        <div class="input-group">
            <label>Student's Department</label>
            <select id="studentDept">
                <option value="Computer Science and Engineering">CSE</option>
            </select>
        </div>

        <div class="input-group">
            <label>Student's Name:</label>
            <input type="text" id="studentName" placeholder="Alif">
        </div>

        <div class="input-group">
            <label>Student's ID:</label>
            <input type="text" id="studentID" placeholder="1230XXXXXX">
        </div>

        <div class="input-group">
            <label>Registration Number:</label>
            <input type="text" id="regNo" placeholder="123456789">
        </div>

        <div class="input-group">
            <label>Year</label>
            <select id="year">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year" selected>2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>
        </div>

        <div class="input-group">
            <label>Semester</label>
            <select id="semester">
                <option value="1st Semester">1st Semester</option>
                <option value="2nd Semester">2nd Semester</option>
            </select>
        </div>

        <div class="input-group">
            <label>Session</label>
            <select id="session">
                <option value="2022-2023">2022-2023</option>
                <option value="2023-2024" selected>2023-2024</option>
                <option value="2024-2025">2024-2025</option>
            </select>
        </div>

        <div class="input-group full-width">
            <label>Submitted To (Teacher's Name):</label>
            <input type="text" id="teacherName" placeholder="Dr. Md. Abul Kalam Azad">
        </div>

        <div class="input-group">
            <label>Teacher's Designation:</label>
            <select id="teacherDesignation">
                <option value="Professor">Professor</option>
                <option value="Associate Professor">Associate Professor</option>
                <option value="Assistant Professor">Assistant Professor</option>
                <option value="Lecturer">Lecturer</option>
            </select>
        </div>

        <div class="input-group">
            <label>Teacher's Department:</label>
            <select id="teacherDept">
                <option value="Computer Science and Engineering">CSE</option>
                <option value="Electrical and Electronic Engineering">EEE</option>
                <option value="Mathematics">Mathematics</option>
                <option value="Physics">Physics</option>
                <option value="Management Information Systems">MIS</option>
            </select>
        </div>

        <div class="input-group full-width">
            <label>Submission Date:</label>
            <input type="date" id="subDate">
        </div>
    </div>

    <button id="generateBtn">Generate Cover Page</button>
</div>

<div id="printable-area" style="display: none;">
    <div class="page-border">
        <div class="header">
            <div class="uni-name">BEGUM ROKEYA UNIVERSITY, RANGPUR</div>
            <img src="https://github.com/With-ALIF/logo_zone/blob/main/education/brur_optimized.png?raw=true" class="logo" alt="BRUR Logo">
            <div class="assignment-label">ASSIGNMENT ON</div>
            <div id="pAssignmentTitle" style="font-size: 24px; font-weight: bold; margin-top: 10px; font-family: 'Times New Roman', serif;"></div>
        </div>

        <div class="course-section">
            <p><strong>Course Code:</strong> <span id="pCourseCode"></span></p>
            <p><strong>Course Title:</strong> <span id="pCourseTitle"></span></p>
        </div>

        <div class="info-container">
            <div class="info-box">
                <div class="box-label">SUBMITTED BY</div>
                <div class="box-container">
                    <p><strong>Name:</strong> <span id="pStudentName"></span></p>
                    <p><strong>ID:</strong> <span id="pStudentID"></span></p>
                    <p><strong>Registration No:</strong> <span id="pRegNo"></span></p>
                    <p><strong>Year:</strong> <span id="pYear"></span></p>
                    <p><strong>Semester:</strong> <span id="pSemester"></span></p>
                    <p><strong>Session:</strong> <span id="pSession"></span></p>
                    <p><strong>Department of</strong> <span id="pStudentDept"></span></p>
                    <p>Begum Rokeya University, Rangpur</p>
                </div>
            </div>

            <div class="info-box">
                <div class="box-label">SUBMITTED TO</div>
                <div class="box-container">
                    <p><span id="pTeacherName"></span></p>
                    <p><span id="pTeacherDesignation"></span></p>
                    <p><strong>Department of</strong> <span id="pTeacherDept"></span></p>
                    <p>Begum Rokeya University, Rangpur</p>
                </div>
            </div>
        </div>

        <div class="date-section">
            <div class="date-box">
                Submitted Date: <span id="pSubDate"></span>
            </div>
        </div>

        <div class="no-print action-buttons">
            <button onclick="window.print()" class="btn-print">Download PDF / Print</button>
            <button onclick="backToEdit()" class="btn-edit">Edit Info</button>
        </div>
    </div>
</div>
    <script src="lib/script.js"></script>
</body>
</html>
